name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  powershell51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Queue and event tests (no model calls)
        shell: powershell
        run: .\tests\run-tests.ps1
  powershell7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Queue and event tests (no model calls)
        shell: pwsh
        run: .\tests\run-tests.ps1
